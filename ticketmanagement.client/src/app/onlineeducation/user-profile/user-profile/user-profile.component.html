<div class="profile-container" [class.collapsed]="isSidebarCollapsed">
  <!-- Left Sidebar -->
  <div class="profile-sidebar">
    <div class="sidebar-toggle-wrap">
      <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <span class="toggle-icon" [class.rotated]="isSidebarCollapsed">◀</span>
      </button>
    </div>
    <div class="profile-card">
      <!-- User Image -->
      <div class="user-avatar">
        <img [src]="user.profileImage" [alt]="user.firstName" class="avatar-img" [class.small]="isSidebarCollapsed" (error)="onImageError($event)" />
      </div>

      <!-- User Name and Email -->
      <div class="user-info" *ngIf="!isSidebarCollapsed">
        <h3 class="user-name">{{ user.firstName }} {{ user.lastName }}</h3>
        <p class="user-email">{{ user.email }}</p>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn btn-primary" (click)="changeProfile()" [class.active]="activeSidebar === 'profile'">
          <span class="btn-icon">✏</span>
          <span class="btn-text" *ngIf="!isSidebarCollapsed">Change Profile</span>
        </button>
        <button class="btn btn-secondary" (click)="viewUserCourse()" title="User Course" [class.active]="activeSidebar === 'course'">
          <span class="btn-icon">📝</span>
          <span class="btn-text" *ngIf="!isSidebarCollapsed">User Course</span>
        </button>
        <button class="btn btn-secondary" (click)="viewTestAttempted()" title="Test Attempted" [class.active]="activeSidebar === 'attempts'">
          <span class="btn-icon">📝</span>
          <span class="btn-text" *ngIf="!isSidebarCollapsed">Test Attempted</span>
        </button>
        <button class="btn btn-secondary" (click)="viewTestScore()" title="View Test Score" [class.active]="activeSidebar === 'scores'">
          <span class="btn-icon">📊</span>
          <span class="btn-text" *ngIf="!isSidebarCollapsed">View Test Score</span>
        </button>
        <button class="btn btn-danger" (click)="logout()" title="Logout" [class.active]="activeSidebar === 'logout'">
          <span class="btn-icon">🚪</span>
          <span class="btn-text" *ngIf="!isSidebarCollapsed">Logout</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Right Content -->
  <div class="profile-content">
   <router-outlet></router-outlet>
  </div>
</div>
